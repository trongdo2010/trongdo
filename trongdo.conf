[General]
skip-proxy = 192.168.0.0/16,10.0.0.0/8,127.0.0.1/32,localhost
dns-server = 94.140.14.14,94.140.15.15
ipv6 = false
always-real-ip = true

[Rule]
# --- Facebook / Instagram / Messenger Ads ---
DOMAIN-SUFFIX,facebookads.net,REJECT
DOMAIN-SUFFIX,fbcdn.net,REJECT
DOMAIN-SUFFIX,fb.me,REJECT
DOMAIN-KEYWORD,fbad,REJECT
DOMAIN-KEYWORD,sponsored,REJECT

# --- TikTok Ads ---
DOMAIN-SUFFIX,tiktokcdn.com,REJECT
DOMAIN-SUFFIX,tiktokv.com,REJECT
DOMAIN-SUFFIX,byteoversea.com,REJECT

# --- Google Ads / YouTube ---
DOMAIN-SUFFIX,googleads.g.doubleclick.net,REJECT
DOMAIN-SUFFIX,adservice.google.com,REJECT
DOMAIN-SUFFIX,ad.doubleclick.net,REJECT
DOMAIN-SUFFIX,pagead2.googlesyndication.com,REJECT
DOMAIN-SUFFIX,youtubeadservices.com,REJECT
DOMAIN-KEYWORD,ads.youtube,REJECT

# --- Zalo Ads / VCMedia / VNG ---
DOMAIN-SUFFIX,ad.zalo.me,REJECT
DOMAIN-SUFFIX,vcmedia.vn,REJECT
DOMAIN-SUFFIX,admicro.vn,REJECT
DOMAIN-SUFFIX,admicro1.vcmedia.vn,REJECT

# --- Tracking / Advertising ---
DOMAIN-SUFFIX,cloudflareinsights.com,REJECT
DOMAIN-SUFFIX,taboola.com,REJECT
DOMAIN-SUFFIX,outbrain.com,REJECT
DOMAIN-SUFFIX,adnxs.com,REJECT
DOMAIN-SUFFIX,adform.net,REJECT
DOMAIN-SUFFIX,adroll.com,REJECT
DOMAIN-SUFFIX,criteo.com,REJECT
DOMAIN-SUFFIX,scorecardresearch.com,REJECT
DOMAIN-SUFFIX,zedo.com,REJECT
DOMAIN-SUFFIX,revcontent.com,REJECT
DOMAIN-SUFFIX,media.net,REJECT
DOMAIN-SUFFIX,yieldmo.com,REJECT
DOMAIN-SUFFIX,smartadserver.com,REJECT
DOMAIN-SUFFIX,moatads.com,REJECT
DOMAIN-SUFFIX,adsafeprotected.com,REJECT
DOMAIN-SUFFIX,bidvertiser.com,REJECT

# --- YouTube ad request filtering ---
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT

# --- URL & tracking keywords ---
DOMAIN-KEYWORD,afftrack,REJECT
DOMAIN-KEYWORD,clickid,REJECT

[URL Rewrite]
# Filter selected YouTube ad endpoints
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) _ reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext _ reject-200

# General video ad request filtering
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302

# Original sponsored/tracking URL filters
^https?:\/\/.*sponsored.*$ reject
^https?:\/\/.*tracking.*$ reject

[MITM]
enabled = true
skip-server-cert-verify = true
hostname = *.facebook.com,*.tiktokcdn.com,*.google.com,*.zalo.me,*.vcmedia.vn,*.doubleclick.net,*.ggpht.com,*.youtube.com,*.googlevideo.com,youtubei.googleapis.com,www.youtube.com,s.youtube.com,-redirector*.googlevideo.com